global:
  sendAnonymousUsage: false

log:
  level: INFO

providers:
  docker:
    exposedByDefault: false
    network: traefik
  file:
    directory: "/etc/traefik/dynamic/"
    watch: true
#  http:
#    endpoint: "http://canary-cd/export/traefik.json"
#    pollInterval: "1s"

entryPoints:
  web:
    address: ":80"

    http:
      redirections:
        entryPoint:
          to: tls
          scheme: https
  tls:
    address: ":443"

certificatesresolvers:
  letsencrypt:
    acme:
      tlschallenge: true
      storage: /etc/acme/acme-letsencrypt.json
      preferredChain: "ISRG Root X1"
